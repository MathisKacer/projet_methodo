[project]
name = "fraude"
version = "0.1.0"
description = "Détection de fraude bancaire : comparaison des méthodes de rééquilibrage"
requires-python = ">=3.10"
dependencies = [
    "kagglehub>=0.3",
    "pandas>=2.0",
    "pyarrow>=14",
    "numpy",
    "scikit-learn",
    "imbalanced-learn",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
